<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Speed Typing Contest</title>
    <link rel="stylesheet" href="style.css?v=2">
  </head>
  <body>
    <main class="app">
      <aside id="floating-timer" class="floating-timer" aria-live="polite" aria-label="Time remaining">
        <span>TIME LEFT</span>
        <b id="timer">05:00</b>
      </aside>


      <header class="page-header">
        <img class="site-logo" src="logo/gsc_logo.png" alt="Good Samaritan Colleges logo">
        <div class="page-heading">
          <h1>Speed Typing Contest</h1>
          <p>Hard Mode • Speed + Accuracy</p>
        </div>
      </header>


      <section class="setup" aria-labelledby="setup-heading">
        <h2 id="setup-heading" class="sr-only">Contest setup</h2>


        <div class="setup-header">
          <h3>Contest setup</h3>
        </div>


        <div class="setup-form">
          <div class="field-group field-full">
            <label for="firstName">Participant Name</label>
            <input id="firstName" type="text" placeholder="First name">
          </div>


          <div class="field-group field-full">
            <label for="middleInitial">Middle Initial</label>
            <input id="middleInitial" type="text" maxlength="2" placeholder="M.I." autocapitalize="characters" autocomplete="off">
