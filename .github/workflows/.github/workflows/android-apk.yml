name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-apk.yml"
      - "android/**"
      - "index.html"
      - "script.js"
      - "style.css"
      - "logo/**"
      - "cetificates/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Package the offline website
        run: python android/package_web.py
      - name: Build debug APK
        run: >-
          gradle --no-daemon --project-dir android assembleDebug
          -PversionCode=${{ github.run_number }}
          -PversionName=1.0.${{ github.run_number }}
      - name: Name APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/speed-typing-contest.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Speed Typing Contest Android 1.0.${{ github.run_number }}
          make_latest: true
          files: android/speed-typing-contest.apk
          body: |
            Installable offline Android app. Contest results are saved on this device and do not sync to the online rankings.
